name: Build Unsigned iOS IPA

on:
  workflow_dispatch: # Manual trigger so it doesn't consume minutes on every push

jobs:
  build-ipa:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true


      - name: Disable Swift Package Manager (use CocoaPods)
        run: flutter config --no-enable-swift-package-manager

      - name: Update Lang Data
        run: dart localization/generator.dart

      - name: Set update check flag
        run: |
          mkdir -p lib/utils
          echo "const updateCheckFlag = true;" > lib/utils/update_check_flag_file.dart

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Patch terminate_restart for modern Flutter
        run: |
          python3 -c '
          import glob
          files = glob.glob("/Users/runner/.pub-cache/**/TerminateRestartPlugin.swift", recursive=True)
          for f in files:
              with open(f, "r") as file:
                  content = file.read()
              if "guard let flutterEngine = flutterViewController.engine" in content:
                  content = content.replace("guard let flutterEngine = flutterViewController.engine else {\n                print(\" [TerminateRestart] Error: No Flutter engine found\")\n                return\n            }", "let flutterEngine = flutterViewController.engine")
                  content = content.replace("guard let flutterEngine = flutterViewController.engine else {", "let flutterEngine = flutterViewController.engine; if false {")
                  with open(f, "w") as file:
                      file.write(content)
                  print("Patched:", f)
          '

      - name: Build iOS IPA (Unsigned)
        run: |
          flutter build ipa --no-codesign || true

      - name: Package into IPA
        run: |
          APP_PATH=""
          if [ -d "build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app" ]; then
            APP_PATH="build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app"
          elif [ -d "build/ios/iphoneos/Runner.app" ]; then
            APP_PATH="build/ios/iphoneos/Runner.app"
          else
            FOUND=$(find build -name "Runner.app" -type d | head -n 1)
            if [ -n "$FOUND" ]; then
              APP_PATH="$FOUND"
            fi
          fi

          if [ -n "$APP_PATH" ] && [ -d "$APP_PATH" ]; then
            echo "Found Runner.app at: $APP_PATH"
            mkdir -p Payload
            cp -r "$APP_PATH" Payload/
            zip -r -9 CloudBeatz-unsigned.ipa Payload
            echo "IPA created successfully!"
          else
            echo "Error: Runner.app could not be found anywhere in build/!"
            exit 1
          fi



      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CloudBeatz-Unsigned-IPA
          path: CloudBeatz-unsigned.ipa
          retention-days: 14
